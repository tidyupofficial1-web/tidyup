<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carico Merci - EatMeFirst</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="carico.css">
</head>
<body>

    <div class="container">
        <!-- Barra superiore: Selettore Lingua e Aiuti -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <label for="lingua-select" style="font-size: 13px; margin-bottom: 0; color: #8b949e;">🌐</label>
                <select id="lingua-select" onchange="cambiaLingua(this.value)" style="width: auto; padding: 4px 8px; font-size: 13px; background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d;">
                    <option value="it">Italiano</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>

            <div class="help-toggle-bar" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                <label style="font-size: 13px; font-weight: normal; cursor: pointer;">
                    <input type="checkbox" id="chk-mostra-aiuti" checked onchange="toggleGlobalHelp(this.checked)"> <span data-i18n="mostraAiuti">Mostra suggerimenti</span>
                </label>
            </div>
        </div>

        <h1 data-i18n="titoloCarico">Carico Merci</h1>
        
        <div class="form-group" data-help="Inquadra il codice a barre o digitalo manualmente. Puoi confermare l'inserimento premendo la Barra Spaziatrice o il tasto Invio sulla tastiera per avviare subito la ricerca nei database.">
            <label data-i18n="labelScanner">🔍 Scanner Barcode & Database Globali (Usa Spazio o Invio per cercare)</label>
            <input type="text" id="barcode-input" placeholder="Scansiona o digita il codice a barre..." onkeydown="handleBarcodeKey(event)">
        </div>

        <button type="button" class="btn-camera" onclick="toggleFotocamera()" id="btn-toggle-cam">📷 <span data-i18n="btnAttivaCam">Attiva Fotocamera / Scanner</span></button>
        <div id="reader"></div>

        <button type="button" class="btn-manuale" onclick="abilitaCompilazioneManuale()">✏️ <span data-i18n="btnManuale">Inserimento Manuale (Mercato, Fatto in casa, No Barcode)</span></button>

        <div id="preview-prodotto">
            <h2 data-i18n="titoloDettagli">Dettagli Prodotto</h2>
            <form onsubmit="registraCarico(event)">
                
                <input type="hidden" id="data-carico">

                <div class="form-group" data-help="Seleziona la categoria merceologica corretta. L'app la compila in automatico ma puoi cambiarla liberamente.">
                    <label data-i18n="labelCategoria">Categoria</label>
                    <select id="categoria-prodotto" required>
                        <option value="Latticini">🥛 Latticini</option>
                        <option value="Ortofrutta">🍎 Ortofrutta</option>
                        <option value="Salumeria">🥓 Salumeria</option>
                        <option value="Panetteria">🍞 Panetteria</option>
                        <option value="Dispensa / Generi alimentari">🥫 Dispensa / Generi alimentari</option>
                        <option value="Surgelati">❄️ Surgelati</option>
                        <option value="Bevande">🧃 Bevande</option>
                        <option value="Igiene">🧴 Igiene</option>
                        <option value="Pulizia">🧹 Pulizia</option>
                        <option value="Casa & Varie">🔋 Casa, Pile & Animali</option>
                        <option value="Altro">📦 Altro</option>
                    </select>
                </div>

                <div class="form-group" data-help="Nome del prodotto compilato automaticamente o inserito a mano.">
                    <label data-i18n="labelNome">Descrizione / Nome Prodotto (Max 45 caratteri)</label>
                    <input type="text" id="nome-prodotto" maxlength="45" placeholder="Es. Dentifricio AZ, Uova Bio..." required>
                    <small style="color: #8b949e;"><span data-i18n="etichettaDatabase">Database</span>: <span id="inf-nome">-</span></small>
                </div>

                <div class="form-group" data-help="Inserisci il marchio del produttore o l'origine (es. 'Mercato rionale', 'Fatto in casa'). Opzionale.">
                    <label data-i18n="labelMarca">Marca / Origine (Opzionale, Max 30 caratteri)</label>
                    <input type="text" id="marca-prodotto" maxlength="30" placeholder="Es. Casalingo, Barilla...">
                    <small style="color: #8b949e;"><span data-i18n="etichettaBrand">Brand</span>: <span id="inf-marca">-</span></small>
                </div>

                <div class="form-group" data-help="Seleziona l'ubicazione. Scegli o crea il luogo dove metti il prodotto.">
                    <label data-i18n="labelUbicazione">Ubicazione (Dinamica basata sui tuoi inserimenti)</label>
                    <select id="ubicazione" required>
                        <option value="" disabled selected data-i18n="opzioneSelezionaUbicazione">-- Seleziona o crea un'ubicazione --</option>
                    </select>
                    <small style="color: #8b949e;"><span data-i18n="notaUbicazione">💡 Puoi aggiungere nuove ubicazioni al volo.</span></small>
                </div>

                <!-- Gestione Quantità e Unità di Misura -->
                <div class="form-group" data-help="Gestisci qui la quantità e l'unità di misura.">
                    <label data-i18n="labelQuantita">Quantità Confezione</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="quantita" value="1" min="1" required style="flex: 2;">
                        <select id="unita-misura" style="flex: 1;">
                            <option value="pezzi" data-i18n="umPezzi">Pezzi</option>
                            <option value="grammi" data-i18n="umGrammi">Grammi (g)</option>
                            <option value="ml" data-i18n="umMl">Millilitri (ml)</option>
                        </select>
                    </div>
                    <small style="color: #58a6ff;" id="inf-conversione" data-i18n="notaConv">💡 Unità standard singola</small>
                </div>

                <!-- Gestione Scadenza Pulita: Giorni, Mesi o Data Esatta (Senza stime automatiche) -->
                <div class="form-group" data-help="Inserisci i giorni, i mesi mancanti alla scadenza, oppure compila direttamente la data esatta stampata sulla confezione.">
                    <label data-i18n="labelScadenzaGestione">Gestione Scadenza (Scegli come inserire)</label>
                    
                    <div style="display: flex; flex-direction: column; gap: 12px; background: #21262d; padding: 12px; border-radius: 8px; border: 1px solid #30363d;">
                        
                        <!-- 1. Giorni -->
                        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                            <label style="font-size: 13px; font-weight: normal; color: #e6edf3; margin-bottom: 0; flex: 1;" data-i18n="labelGiorni">⏳ Tra quanti giorni scade?</label>
                            <input type="number" id="stima-giorni" placeholder="Es. 3" min="1" oninput="pulisciAltriCampiScadenza('giorni')" style="width: 110px; background-color: #ffffff; color: #24292e; text-align: center;">
                        </div>

                        <!-- 2. Mesi -->
                        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                            <label style="font-size: 13px; font-weight: normal; color: #e6edf3; margin-bottom: 0; flex: 1;" data-i18n="labelMesi">📅 Tra quanti mesi scade?</label>
                            <input type="number" id="stima-mesi" placeholder="Es. 6" min="1" oninput="pulisciAltriCampiScadenza('mesi')" style="width: 110px; background-color: #ffffff; color: #24292e; text-align: center;">
                        </div>

                        <!-- 3. Data Esatta Manuale (GG / MM / AAAA) -->
                        <div style="border-top: 1px dashed #30363d; padding-top: 10px; text-align: center;">
                            <label style="font-size: 13px; font-weight: normal; margin-bottom: 6px; color: #e6edf3;" data-i18n="labelDataEsatta">Oppure inserisci la data esatta stampata:</label>
                            <div style="display: flex; gap: 8px; align-items: center; justify-content: center;">
                                <input type="text" id="scad-gg" placeholder="GG" maxlength="2" style="width: 60px; text-align: center; background-color: #ffffff; color: #24292e;" oninput="pulisciAltriCampiScadenza('data'); saltoAutomatico(this, 'scad-mm', 2)">
                                <span style="font-weight: bold; font-size: 18px; color: #e6edf3;">/</span>
                                <input type="text" id="scad-mm" placeholder="MM" maxlength="2" style="width: 60px; text-align: center; background-color: #ffffff; color: #24292e;" oninput="pulisciAltriCampiScadenza('data'); saltoAutomatico(this, 'scad-aa', 2)">
                                <span style="font-weight: bold; font-size: 18px; color: #e6edf3;">/</span>
                                <input type="text" id="scad-aa" placeholder="AAAA" maxlength="4" style="width: 80px; text-align: center; background-color: #ffffff; color: #24292e;" oninput="pulisciAltriCampiScadenza('data')">
                            </div>
                        </div>

                    </div>
                </div>

                <img id="img-anteprima" src="" alt="Anteprima prodotto">

                <button type="submit" data-i18n="btnRegistra">Registra Carico in Dispensa</button>
            </form>
        </div>

        <div class="menu-link">
            <a href="menu.html" data-i18n="linkTornaMenu">← Torna al Menu Principale</a>
        </div>

        <div class="footer">
            <div class="footer-logo">
                <img src="IMG/logo_1024_white.png" alt="EatMeFirst Logo" style="max-width: 90px; height: auto;">
            </div>
            <div data-i18n="footerText">Gestione locale sicura &bull; Risparmia cibo, vivi meglio</div>
        </div>
    </div>

    <!-- Popup / Modale Guida Contestuale -->
    <div id="tooltip-modal" class="tooltip-modal">
        <div class="tooltip-content">
            <h3 data-i18n="modalTitolo">💡 Suggerimento Utile</h3>
            <p id="tooltip-text"></p>
            <button type="button" onclick="chiudiTooltip()" data-i18n="modalBtn">Ho capito</button>
        </div>
    </div>

    <script src="carico.js"></script>
</body>
</html>
