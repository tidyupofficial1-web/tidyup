<script>
        let html5QrCode = null;
        let cameraAttiva = false;

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('eat_me_first_lang') || 'it';
            document.getElementById('lingua-select').value = savedLang;
            applicaTraduzioniCarico(savedLang);
            document.getElementById('barcode-input').focus();
        });

        function cambiaLingua(lang) {
            localStorage.setItem('eat_me_first_lang', lang);
            applicaTraduzioniCarico(lang);
        }

        function applicaTraduzioniCarico(lang) {
            const testi = {
                it: { 
                    title: "Carico Merci", 
                    scanTitle: "🔍 Scanner Barcode & Open Food Facts",
                    scanDesc: "Inquadra il codice a barre o inseriscilo e premi Invio. Se il prodotto non viene trovato, cercheremo alternative o potrai compilarlo.",
                    btnCerca: "Cerca",
                    btnCamOn: "Attiva Fotocamera / Scanner",
                    btnCamOff: "Chiudi Fotocamera",
                    btnManuale: "✏️ Compila Manualmente (Senza Barcode / Prodotto senza scadenza)",
                    nome: "Nome Prodotto", 
                    marca: "Marca (Opzionale)",
                    ubicazione: "Ubicazione (Es. Frigo, Dispensa)",
                    scadenza: "Data di Scadenza (verifica se appropriata)", 
                    quantita: "Quantità", 
                    btn: "Registra Carico", 
                    menu: "← Torna al Menu Principale",
                    footer: "EatMeFirst &bull; Gestione locale sicura"
                },
                // ... (altre lingue rimangono invariate)
            };
            // ... (logica traduzioni esistente)
        }

        function handleBarcodeKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                cercaOpenFoodFacts();
            }
        }

        async function toggleFotocamera() {
            // ... (codice fotocamera invariato)
        }

        async function cercaOpenFoodFacts() {
            const barcode = document.getElementById('barcode-input').value.trim();
            if (!barcode) {
                alert("Inserisci o scansiona un codice a barre valido o usa la compilazione manuale.");
                return;
            }

            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await response.json();

                const groupScadenza = document.getElementById('group-scadenza');
                const badgeContainer = document.getElementById('inf-tipo-scadenza-badge');

                if (data && data.status === 1) {
                    const prodotto = data.product;
                    const nome = prodotto.product_name || prodotto.product_name_it || "";
                    const marca = prodotto.brands || "";
                    const quantitaOFF = prodotto.quantity || "";
                    const immagine = prodotto.image_front_url || "";

                    if(nome) document.getElementById('nome-prodotto').value = nome;
                    if(marca) document.getElementById('marca-prodotto').value = marca;

                    document.getElementById('inf-nome').textContent = nome || "Sconosciuto";
                    document.getElementById('inf-marca').textContent = marca || "Non specificata";
                    document.getElementById('inf-quantita-OFF').textContent = quantitaOFF || "Non specificata";

                    groupScadenza.style.display = 'block';
                    const dataConsigliata = new Date();
                    dataConsigliata.setDate(dataConsigliata.getDate() + 30);
                    document.getElementById('scadenza').value = dataConsigliata.toISOString().split('T')[0];
                    
                    badgeContainer.innerHTML = '<span class="scadenza-badge badge-consigliata">⚠️ Scadenza Consigliata (Verifica se appropriata)</span>';

                    const imgEl = document.getElementById('img-anteprima');
                    if(immagine) {
                        vimgEl.src = immagine;
                        imgEl.style.display = 'block';
                    } else {
                        imgEl.style.display = 'none';
                    }

                    document.getElementById('preview-prodotto').style.display = 'block';
                    document.getElementById('ubicazione').focus();
                } else {
                    // PRODOTTO NON TROVATO SU OPEN FOOD FACTS -> ATTHIAMO LA RICERCA ALTERNATIVA O FALLBACK SU ALTRI SITI
                    gestisciProdottoNonTrovato(barcode);
                }
            } catch (error) {
                console.error("Errore di connessione:", error);
                gestisciProdottoNonTrovato(barcode);
            }
        }

        // Funzione di supporto per cercare su altri siti/fonti o fallback
        function gestisciProdottoNonTrovato(barcode) {
            const cercaSulWeb = confirm(`Il codice a barre (${barcode}) non è presente su Open Food Facts.\n\nVuoi aprire una ricerca sul web per trovare informazioni o procedere con la compilazione manuale?`);
            
            if (cercaSulWeb) {
                // Apre una scheda con Google o un altro motore di ricerca cercando il codice a barre specifico
                window.open(`https://www.google.com/search?q=${encodeURIComponent(barcode)}`, '_blank');
            }
            
            // Passa comunque alla compilazione manuale per permettere all'utente di inserirlo
            abilitaCompilazioneManuale();
            // Pre-imposta il nome o lascia un indizio visivo se desiderato
            document.getElementById('nome-prodotto').value = `Prodotto [${barcode}]`;
        }

        function abilitaCompilazioneManuale() {
            const groupScadenza = document.getElementById('group-scadenza');
            const badgeContainer = document.getElementById('inf-tipo-scadenza-badge');
            
            const haScadenza = confirm("Il prodotto ha una scadenza? (Premi 'OK' se ha scadenza tassativa da inserire, 'Annulla' se è un prodotto senza scadenza come i detersivi)");

            if (haScadenza) {
                groupScadenza.style.display = 'block';
                document.getElementById('scadenza').value = '';
                document.getElementById('scadenza').required = true;
                badgeContainer.innerHTML = '<span class="scadenza-badge badge-tassativa">🔒 Scadenza Tassativa (Inserimento manuale obbligatorio)</span>';
            } else {
                groupScadenza.style.display = 'none';
                document.getElementById('scadenza').required = false;
                document.getElementById('scadenza').value = '';
                badgeContainer.innerHTML = '<span class="scadenza-badge" style="background:#30363d; color:#8b949e;">Prodotto senza scadenza (es. Detersivo/Non alimentare)</span>';
            }

            document.getElementById('preview-prodotto').style.display = 'block';
            document.getElementById('nome-prodotto').focus();
        }

        function registraCarico(event) {
            event.preventDefault();

            const gruppoScadenzaVisibile = document.getElementById('group-scadenza').style.display !== 'none';
            const dataScadenzaVal = gruppoScadenzaVisibile ? document.getElementById('scadenza').value : "Nessuna scadenza";

            const nuovoArticolo = {
                id: Date.now(),
                nome: document.getElementById('nome-prodotto').value.trim(),
                marca: document.getElementById('marca-prodotto').value.trim(),
                ubicazione: document.getElementById('ubicazione').value.trim() || "Dispensa",
                scadenza: dataScadenzaVal,
                quantita: parseInt(document.getElementById('quantita').value) || 1,
                immagine: document.getElementById('img-anteprima').src || "",
                dataCarico: new Date().toISOString()
            };

            let db = JSON.parse(localStorage.getItem('eat_me_first_db')) || { dispensa: [] };
            if (!db.dispensa) db.dispensa = [];
            
            db.dispensa.push(nuovoArticolo);
            localStorage.setItem('eat_me_first_db', JSON.stringify(db));

            alert("Articolo caricato con successo nella dispensa!");
            window.location.href = "dispensa.html";
        }
    </script>
