<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Carico Articoli</title>
    <script src="i18n.js" onerror="console.log('i18n.js non trovato')"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #1f6feb;
            --accent-green: #238636;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container { 
            max-width: 750px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        }

        h1 { 
            color: #58a6ff; 
            font-size: 1.8rem; 
            text-align: center; 
            margin-bottom: 25px; 
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-muted); font-size: 0.95rem; }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            background: #0d1117; 
            border: 1px solid var(--border-color); 
            color: var(--text-main);
            border-radius: 6px; 
            font-size: 1rem; 
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: var(--accent-blue); outline: none; }

        .btn { 
            background-color: var(--accent-green); 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem; 
            width: 100%;
        }
        .btn:hover { opacity: 0.9; }

        #msgInfo {
            font-size: 0.85rem;
            color: #58a6ff;
            margin-top: 5px;
            display: none;
        }

        #boxAnteprima {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        #imgProdotto {
            max-width: 100px;
            max-height: 100px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .back-link { display: block; text-align: center; margin-top: 25px; color: #58a6ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>📥 Carico Articolo</h1>

    <div class="form-group">
        <label for="codiceBarre">Codice a Barre</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="codiceBarre" placeholder="Scansiona o digita il codice..." onblur="cercaSuOpenFoodFactsMultipli()">
        </div>
        <div id="msgInfo">Interrogazione database in corso...</div>
        <div id="boxAnteprima">
            <img id="imgProdotto" src="" alt="Anteprima prodotto">
        </div>
    </div>

    <div class="form-group">
        <label for="nomeProdotto">Nome Prodotto</label>
        <input type="text" id="nomeProdotto" placeholder="Nome o descrizione articolo...">
    </div>

    <div class="form-group">
        <label for="quantita">Quantità</label>
        <input type="number" id="quantita" value="1" min="1">
    </div>

    <div class="form-group">
        <label for="scadenza">Data di Scadenza</label>
        <input type="date" id="scadenza">
        <div id="tipoScadenzaLabel" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Scadenza consigliata</div>
    </div>

    <button class="btn" onclick="salvaArticolo()">Registra Carico</button>

    <a href="menu.html" class="back-link">⬅ Torna al Menu Principale</a>
</div>

<script>
    let urlImmagineCorrente = "";

    function impostaTipoScadenza(tipo) {
        let lbl = document.getElementById('tipoScadenzaLabel');
        if (tipo === 'tassativa') {
            lbl.textContent = "⚠️ Scadenza tassativa (Prodotto fresco/alimentare)";
            lbl.style.color = "#da3633";
        } else {
            lbl.textContent = "ℹ️ Scadenza consigliata (No-Food o lunga conservazione)";
            lbl.style.color = "var(--text-muted)";
        }
    }

    // Sistema ibrido: Memoria Locale (per No-Food e articoli personali) + Database Online
    async function cercaSuOpenFoodFactsMultipli() {
        let barcode = document.getElementById('codiceBarre').value.trim();
        if (!barcode) return;

        let msgInfo = document.getElementById('msgInfo');

        // 1. Controllo immediato nella memoria locale dei prodotti No-Food / personalizzati già usati in precedenza
        let prodottiSalvatiLocali = JSON.parse(localStorage.getItem('eat_nofood_custom')) || {};
        if (prodottiSalvatiLocali[barcode]) {
            let p = prodottiSalvatiLocali[barcode];
            document.getElementById('nomeProdotto').value = p.nome;
            impostaTipoScadenza('consigliata'); // I prodotti non alimentari non hanno scadenza tassativa
            msgInfo.style.display = 'none';
            return;
        }

        // 2. Se non è in locale, interroghiamo i database ufficiali (Food & Beauty)
        msgInfo.textContent = "Interrogazione database in corso...";
        msgInfo.style.display = 'block';

        let endpoints = [
            `https://world.openfoodfacts.org/api/v0/product/${barcode}.json`,
            `https://world.openbeautyfacts.org/api/v0/product/${barcode}.json`
        ];

        let trovato = false;
        for (let url of endpoints) {
            try {
                let response = await fetch(url);
                let data = await response.json();
                if (data.status === 1 && data.product) {
                    trovato = true;
                    msgInfo.style.display = 'none';

                    let nome = data.product.product_name_it || data.product.product_name || "";
                    let marca = data.product.brands || "";
                    document.getElementById('nomeProdotto').value = (marca && nome) ? `${marca} - ${nome}` : (nome || marca);

                    let categorie = (data.product.categories_tags || []).join(" ").toLowerCase();
                    if (url.includes("openbeautyfacts") || categorie.includes("non-food") || categorie.includes("no-food")) {
                        impostaTipoScadenza('consigliata');
                    } else if (categorie.includes("fresh") || categorie.includes("fresco") || categorie.includes("milk") || categorie.includes("latte") || categorie.includes("meat") || categorie.includes("carne")) {
                        impostaTipoScadenza('tassativa');
                    } else {
                        impostaTipoScadenza('consigliata');
                    }

                    urlImmagineCorrente = data.product.image_front_small_url || data.product.image_front_url || "";
                    if (urlImmagineCorrente) {
                        document.getElementById('imgProdotto').src = urlImmagineCorrente;
                        document.getElementById('boxAnteprima').style.display = 'block';
                    }
                    break;
                }
            } catch (e) {}
        }

        if (!trovato) {
            msgInfo.style.display = 'none';
            let esito = confirm("Prodotto non trovato nei database online (es. articolo no-food come fazzoletti o bicchieri).\n\nVuoi inserire il nome manualmente? Verrà memorizzato in modo che la prossima volta la scansione di questo codice lo riconoscerà subito!");
            if (esito) {
                document.getElementById('nomeProdotto').focus();
                impostaTipoScadenza('consigliata');
            }
        }
    }

    function salvaArticolo() {
        let barcode = document.getElementById('codiceBarre').value.trim();
        let nome = document.getElementById('nomeProdotto').value.trim();
        let quantita = parseInt(document.getElementById('quantita').value) || 1;
        let scadenza = document.getElementById('scadenza').value;

        if (!nome) {
            alert("Inserisci o cerca il nome del prodotto.");
            return;
        }

        // Se è un articolo personalizzato o no-food senza barcode online, lo salviamo in locale
        if (barcode) {
            let prodottiSalvatiLocali = JSON.parse(localStorage.getItem('eat_nofood_custom')) || {};
            if (!prodottiSalvatiLocali[barcode]) {
                prodottiSalvatiLocali[barcode] = { nome: nome };
                localStorage.setItem('eat_nofood_custom', JSON.stringify(prodottiSalvatiLocali));
            }
        }

        let nuovoItem = {
            id: Date.now(),
            codiceBarre: barcode,
            nome: nome,
            quantita: quantita,
            scadenza: scadenza,
            immagine: urlImmagineCorrente,
            categoriagenerale: "Generale"
        };

        let dispensa = JSON.parse(localStorage.getItem('eatMeFirst_dispensa')) || [];
        dispensa.push(nuovoItem);
        localStorage.setItem('eatMeFirst_dispensa', JSON.stringify(dispensa));

        alert("Articolo caricato con successo nella dispensa!");
        window.location.href = 'menu.html';
    }
</script>

</body>
</html>
