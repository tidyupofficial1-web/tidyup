<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carico Merci - EatMeFirst</title>
    <!-- Libreria per lo scanner di codici a barre tramite fotocamera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="carico.css">
</head>
<body>

    <div class="container">
        <!-- Controllo globale per attivare/disattivare gli aiuti -->
        <div class="help-toggle-bar">
            <label style="font-size: 13px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="chk-mostra-aiuti" checked onchange="toggleGlobalHelp(this.checked)"> Mostra suggerimenti e guide passo-passo
            </label>
        </div>

        <h1>Carico Merci</h1>
        
        <div class="form-group" data-help="Inquadra il codice a barre del prodotto con la fotocamera o digitinalo manualmente premendo Invio o la Barra Spaziatrice per avviare il riconoscimento automatico dai database globali.">
            <label>🔍 Scanner Barcode & Database Globali</label>
            <input type="text" id="barcode-input" placeholder="Scansiona o digita il codice a barre..." onkeydown="handleBarcodeKey(event)">
        </div>

        <button type="button" class="btn-camera" onclick="toggleFotocamera()" id="btn-toggle-cam">📷 Attiva Fotocamera / Scanner</button>
        <div id="reader"></div>

        <button type="button" class="btn-manuale" onclick="abilitaCompilazioneManuale()">✏️ Inserimento Manuale (Mercato, Fatto in casa, No Barcode)</button>

        <div id="preview-prodotto">
            <h2>Dettagli Prodotto</h2>
            <form onsubmit="registraCarico(event)">
                
                <input type="hidden" id="data-carico">

                <div class="form-group" data-help="Seleziona la categoria merceologica corretta. Aiuterà il sistema a gestire le scadenze e le ubicazioni ideali.">
                    <label>Categoria</label>
                    <select id="categoria-prodotto" required>
                        <option value="Latticini">🥛 Latticini</option>
                        <option value="Ortofrutta">🍎 Ortofrutta</option>
                        <option value="Salumeria">🥓 Salumeria</option>
                        <option value="Panetteria">🍞 Panetteria</option>
                        <option value="Dispensa / Generi alimentari">🥫 Dispensa / Generi alimentari</option>
                        <option value="Surgelati">❄️ Surgelati</option>
                        <option value="Bevande">🧃 Bevande</option>
                        <option value="Igiene">🧴 Igiene</option>
                        <option value="Pulizia">🧹 Pulizia</option>
                        <option value="Casa & Varie">🔋 Casa, Pile & Animali</option>
                        <option value="Altro">📦 Altro</option>
                    </select>
                </div>

                <div class="form-group" data-help="Nome del prodotto compilato automaticamente dal codice a barre. Puoi integrarlo o modificarlo a piacimento (massimo 45 caratteri per mantenere le schermate pulite).">
                    <label>Descrizione / Nome Prodotto (Max 45 caratteri)</label>
                    <input type="text" id="nome-prodotto" maxlength="45" placeholder="Es. Uova Bio, Pile stilo, Croccantini..." required oninput="stimaScadenzaDallaDescrizione(this.value)">
                    <small style="color: #8b949e;">Database: <span id="inf-nome">-</span></small>
                </div>

                <div class="form-group" data-help="Inserisci il marchio del produttore o la provenienza (es. 'Mercato rionale', 'Fatto in casa'). Opzionale.">
                    <label>Marca / Origine (Opzionale, Max 30 caratteri)</label>
                    <input type="text" id="marca-prodotto" maxlength="30" placeholder="Es. Casalingo, Barilla...">
                    <small style="color: #8b949e;">Brand: <span id="inf-marca">-</span></small>
                </div>

                <div class="form-group" data-help="Scegli dove conserverai fisicamente il prodotto. La scelta influisce sui promemoria di conservazione.">
                    <label>Ubicazione</label>
                    <select id="ubicazione">
                        <option value="Dispensa">Dispensa</option>
                        <option value="Frigorifero">Frigorifero</option>
                        <option value="Freezer">Freezer</option>
                        <option value="Cantina / Altro">Cantina / Altro</option>
                    </select>
                </div>

                <!-- Gestione Quantità e Unità di Misura -->
                <div class="form-group" data-help="Se compri una confezione multipla (es. 18 uova o 6 bottiglie), indica qui il totale dei singoli pezzi o grammi contenuti, così quando scaricherai consumerai solo quelli parzialmente.">
                    <label>Quantità Interna Totale (Pezzi o Grammi)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="quantita" value="1" min="1" required style="flex: 2;">
                        <select id="unita-misura" style="flex: 1;">
                            <option value="pezzi">Pezzi</option>
                            <option value="grammi">Grammi (g)</option>
                            <option value="ml">Millilitri (ml)</option>
                        </select>
                    </div>
                    <small style="color: #58a6ff;" id="inf-conversione">💡 Confezione standard</small>
                </div>

                <!-- Sezione Data di Scadenza -->
                <div class="form-group" id="group-scadenza" data-help="Inserisci la data di scadenza reale (tassativa) o verifica quella stimata automaticamente dall'applicazione.">
                    <label>Data di Scadenza</label>
                    <div class="date-inputs-container">
                        <input type="date" id="scadenza" style="width: 100%; text-align: center;">
                    </div>
                    <div id="inf-tipo-scadenza-badge"></div>
                </div>

                <img id="img-anteprima" src="" alt="Anteprima prodotto">

                <button type="submit">Registra Carico in Dispensa</button>
            </form>
        </div>

        <div class="menu-link">
            <a href="menu.html">← Torna al Menu Principale</a>
        </div>

        <div class="footer">
            <div class="footer-logo">🍏 EatMeFirst</div>
            <div>Gestione locale sicura &bull; Risparmia cibo, vivi meglio</div>
        </div>
    </div>

    <!-- Popup / Modale Guida Contestuale -->
    <div id="tooltip-modal" class="tooltip-modal">
        <div class="tooltip-content">
            <h3>💡 Suggerimento Utile</h3>
            <p id="tooltip-text"></p>
            <button type="button" onclick="chiudiTooltip()">Ho capito</button>
        </div>
    </div>

    <script src="carico.js"></script>
</body>
</html>
