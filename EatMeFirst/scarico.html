<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Scarico Prodotti</title>
    <script src="i18n.js" onerror="console.log('i18n.js non trovato')"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #1f6feb;
            --accent-green: #238636;
            --accent-red: #da3633;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container { 
            max-width: 750px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        }

        h1 { color: #58a6ff; font-size: 1.8rem; text-align: center; margin-bottom: 25px; }

        .search-box { margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 12px; 
            background: #0d1117; 
            border: 1px solid var(--border-color); 
            color: var(--text-main);
            border-radius: 6px; 
            font-size: 1rem; 
            box-sizing: border-box;
        }
        input:focus { border-color: var(--accent-blue); outline: none; }

        .item-card {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .item-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: var(--text-main); }
        .item-info p { margin: 2px 0; font-size: 0.85rem; color: var(--text-muted); }

        .btn-scarica { 
            background-color: var(--accent-red); 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .btn-scarica:hover { opacity: 0.9; }

        .empty-msg { text-align: center; color: var(--text-muted); padding: 20px; }

        .back-link { display: block; text-align: center; margin-top: 25px; color: #58a6ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>📤 Scarico / Consumo Prodotti</h1>

    <div class="search-box">
        <input type="text" id="filtroProdotti" placeholder="Cerca prodotto in dispensa..." oninput="caricaListaDispensa()">
    </div>

    <div id="listaContainer">
        <!-- I prodotti verranno inseriti qui dinamicamente -->
    </div>

    <a href="menu.html" class="back-link">⬅ Torna al Menu Principale</a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        caricaListaDispensa();
    });

    function caricaListaDispensa() {
        let container = document.getElementById('listaContainer');
        let filtro = document.getElementById('filtroProdotti').value.toLowerCase();
        
        let dispensa = JSON.parse(localStorage.getItem('eatMeFirst_dispensa')) || [];
        container.innerHTML = "";

        let prodottiFiltrati = dispensa.filter(item => item.nome.toLowerCase().includes(filtro) || item.ubicazione.toLowerCase().includes(filtro));

        if (prodottiFiltrati.length === 0) {
            container.innerHTML = `<div class="empty-msg">Nessun prodotto trovato in dispensa.</div>`;
            return;
        }

        prodottiFiltrati.forEach(item => {
            let card = document.createElement('div');
            card.className = 'item-card';

            card.innerHTML = `
                <div class="item-info">
                    <h3>${item.nome}</h3>
                    <p>📦 Q.tà: <b>${item.quantita}</b> | 📍 Ubicazione: <b>${item.ubicazione}</b></p>
                    <p>⏳ Scadenza: ${item.scadenza ? item.scadenza : 'Nessuna'}</p>
                </div>
                <button class="btn-scarica" onclick="scaricaProdotto(${item.id})">Consuma / Elimina</button>
            `;
            container.appendChild(card);
        });
    }

    function scaricaProdotto(id) {
        let dispensa = JSON.parse(localStorage.getItem('eatMeFirst_dispensa')) || [];
        let index = dispensa.findIndex(item => item.id === id);

        if (index !== -1) {
            let prodottoRimosso = dispensa.splice(index, 1)[0];
            
            // Aggiorna la dispensa in memoria
            localStorage.setItem('eatMeFirst_dispensa', JSON.stringify(dispensa));

            // Aggiunge automaticamente il prodotto alla lista della spesa (liste.html)
            let listaSpesa = JSON.parse(localStorage.getItem('eatMeFirst_spesa')) || [];
            
            // Verifica se non è già presente per evitare doppioni
            let esisteGia = listaSpesa.some(item => item.nome.toLowerCase() === prodottoRimosso.nome.toLowerCase());
            if (!esisteGia) {
                listaSpesa.push({
                    id: Date.now(),
                    nome: prodottoRimosso.nome,
                    quantita: prodottoRimosso.quantita || 1,
                    comprato: false
                });
                localStorage.setItem('eatMeFirst_spesa', JSON.stringify(listaSpesa));
            }

            alert(`Prodotto "${prodottoRimosso.nome}" scaricato dalla dispensa e aggiunto alla lista della spesa!`);
            caricaListaDispensa();
        }
    }
</script>

</body>
</html>
