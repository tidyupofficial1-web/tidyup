<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Menu Principale</title>
    <!-- Collegamento al file centrale delle 5 lingue -->
    <script src="i18n.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        p {
            color: #8b949e;
            font-size: 1rem;
            margin: 0;
        }
        .menu-grid {
            display: grid;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .menu-btn {
            background: #161b22;
            border: 1px solid #30363d;
            color: #f0f6fc;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            transition: background 0.2s, border-color 0.2s;
            display: block;
        }
        .menu-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        footer {
            margin-top: 50px;
            color: #8b949e;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <!-- Qui appare automaticamente il selettore delle 5 lingue -->
        <div id="header-lang"></div>
    </div>

    <div class="header-container">
        <h1 id="txt-menu-title">Menu Principale</h1>
        <p id="txt-menu-subtitle">Gestione Intelligente della Dispensa</p>
    </div>

    <div class="menu-grid">
        <a href="carico.html" class="menu-btn" id="txt-btn-carico">📥 Carico Articolo</a>
        <a href="dispensa.html" class="menu-btn" id="txt-btn-dispensa">📋 Visualizza Dispensa</a>
        <a href="spesa.html" class="menu-btn" id="txt-btn-spesa">🛒 Lista della Spesa</a>
        <a href="impostazioni.html" class="menu-btn" id="txt-btn-impostazioni">⚙️ Impostazioni</a>
        <a href="termini.html" class="menu-btn" id="txt-btn-termini">📄 Termini e Condizioni</a>
    </div>

    <footer id="txt-footer">
        EatMeFirst &bull; Dati locali su dispositivo
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Inserisce il selettore delle 5 lingue nell'header
            const containerLang = document.getElementById('header-lang');
            if (containerLang) {
                containerLang.innerHTML = creaSelettoreLinguaHTML();
            }

            // 2. Applica le traduzioni ai testi della pagina in base alla lingua attiva
            applicaTraduzioniInterfaccia();
        });

        function applicaTraduzioniInterfaccia() {
            const lang = getLinguaCorrente();
            const t = dizionarioGlobale[lang] || dizionarioGlobale['it'];

            document.getElementById('txt-menu-title').textContent = t.menuTitle;
            document.getElementById('txt-menu-subtitle').textContent = t.menuSubtitle;
            document.getElementById('txt-btn-carico').textContent = t.caricoArticolo;
            document.getElementById('txt-btn-dispensa').textContent = t.visualizzaDispensa;
            document.getElementById('txt-btn-spesa').textContent = t.spesa || "🛒 Lista della Spesa";
            document.getElementById('txt-btn-impostazioni').textContent = t.impostazioni;
            document.getElementById('txt-btn-termini').textContent = t.terminiTitle || "📄 Termini e Condizioni";
            document.getElementById('txt-footer').innerHTML = t.footer;
        }
    </script>
</body>
</html>
