<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Menu Principale</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #16a085;
            --accent: #e74c3c;
            --bg: #f0f3f4;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border: #dcdde1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
        
        header { 
            background: linear-gradient(135deg, #2c3e50, #16a085); 
            color: white; 
            padding: 2rem 1rem; 
            text-align: center; 
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { font-size: 1.6rem; margin-bottom: 5px; }
        p { font-size: 0.95rem; opacity: 0.9; }
        
        .container { max-width: 500px; margin: 1.5rem auto; padding: 0 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
        
        /* Pulsanti del menu uniformi e colorati con icone */
        .menu-btn { 
            background: var(--card-bg); 
            color: var(--text); 
            border: 1px solid var(--border); 
            border-left: 5px solid var(--secondary);
            padding: 1rem 1.2rem; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 1.05rem; 
            font-weight: 600; 
            text-align: left; 
            text-decoration: none; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.04); 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        .menu-btn:hover { 
            background: #ffffff; 
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            border-color: var(--secondary);
        }

        /* Differenziamo leggermente i bordi laterali per gruppo per dare colore */
        .btn-dispensa { border-left-color: #3498db; }
        .btn-spesa { border-left-color: #e67e22; }
        .btn-note { border-left-color: var(--accent); }

        /* Effetto lampeggiante per notifiche Block Notes */
        @keyframes pulse-blink {
            0% { border-left-color: var(--accent); background-color: rgba(231, 76, 60, 0.05); }
            50% { border-left-color: #c0392b; background-color: rgba(231, 76, 60, 0.15); }
            100% { border-left-color: var(--accent); background-color: rgba(231, 76, 60, 0.05); }
        }
        .blinking-btn { animation: pulse-blink 1.2s infinite; }

        /* Popup Notifica Nuove Note sul Menu */
        #popup-notifica { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
        #popup-box { background: white; width: 100%; max-width: 400px; padding: 25px 20px; border-radius: 12px; box-shadow: 0 6px 25px rgba(0,0,0,0.25); text-align: center; }
        #popup-box h3 { color: var(--accent); margin-bottom: 10px; font-size: 1.2rem; }
        #popup-box p { font-size: 0.95rem; color: #444; line-height: 1.4; margin-bottom: 20px; }
        .popup-actions { display: flex; gap: 10px; }
        .popup-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .btn-chiudi { background: #ecf0f1; color: #7f8c8d; }
        .btn-chiudi:hover { background: #bdc3c7; color: #2c3e50; }
        .btn-apri { background: var(--secondary); color: white; }
        .btn-apri:hover { background: #117a65; }
    </style>
</head>
<body>

    <header>
        <h1>EatMeFirst</h1>
        <p>Gestione Intelligente Dispensa e Spesa</p>
    </header>

    <div class="container">
        <!-- Funzioni Storiche della Dispensa -->
        <a href="carico.html" class="menu-btn btn-dispensa">📦 Carico Articolo</a>
        <a href="scarico.html" class="menu-btn btn-dispensa">📤 Scarico Prodotti</a>
        <a href="dispensa.html" class="menu-btn btn-dispensa">📋 Visualizza Dispensa</a>

        <!-- Sezioni Spesa e Note -->
        <a href="liste.html" class="menu-btn btn-spesa">🛒 Lista della Spesa</a>
        <a href="spesa.html" class="menu-btn btn-spesa">🛍️ Articoli da comperare</a>
        <a href="mia_lista.html" id="btn-block-notes" class="menu-btn btn-note">💭 Ricordarsi di...</a>
    </div>

    <!-- Popup Notifica Nuove Note -->
    <div id="popup-notifica">
        <div id="popup-box">
            <h3>Nuovi Appunti nel Block Notes!</h3>
            <p>Ci sono promemoria o note inserite in "Ricordarsi di..." in attesa di lettura.</p>
            <div class="popup-actions">
                <button class="popup-btn btn-chiudi" onclick="chiudiPopupNotifica()">Ho capito</button>
                <button class="popup-btn btn-apri" onclick="apriBlockNotes()">Vai a Ricordarsi di...</button>
            </div>
        </div>
    </div>

    <script>
        // Controllo dello stato da localStorage per le notifiche non lette del Block Notes
        window.onload = function() {
            let db = JSON.parse(localStorage.getItem('eat_me_first_db')) || { note: [] };
            
            // Verifica se ci sono note non lette (letto === false)
            let haNoteNonLette = db.note && db.note.some(n => n.letto === false);
            
            if (haNoteNonLette) {
                // Attiva il lampeggio sul pulsante "Ricordarsi di..."
                document.getElementById('btn-block-notes').classList.add('blinking-btn');
                // Mostra il popup di notifica sul menu
                document.getElementById('popup-notifica').style.display = 'flex';
            }
        };

        function chiudiPopupNotifica() {
            document.getElementById('popup-notifica').style.display = 'none';
        }

        function apriBlockNotes() {
            window.location.href = 'mia_lista.html';
        }
    </script>
</body>
</html>
