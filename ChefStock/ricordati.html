<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChefStock - Ricordarsi di...</title>
    <link rel="stylesheet" href="inventario.css">
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <header class="top-bar" style="padding: 15px 20px;">
        <div class="app-header-right" style="display: flex; align-items: center; gap: 12px;">
            <img src="IMG/logo_chefstock.png" alt="Logo ChefStock" style="width: 38px; height: 38px; border-radius: 50%;">
            <div class="app-title">ChefStock <span>- Ricordarsi di...</span></div>
        </div>
    </header>

    <div class="container" style="max-width: 700px; display: flex; flex-direction: column; gap: 15px; margin: 30px auto;">
        
        <!-- CARD PRINCIPALE BLOCK NOTES -->
        <div class="ricordati-card" style="background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px;">
            <div class="section-title" style="font-size: 1.1rem; color: #58a6ff; margin-bottom: 8px;">📝 Note e Promemoria</div>
            <p style="font-size: 0.9rem; color: #8b949e; line-height: 1.4; margin-bottom: 15px;">
                Gestisci qui i tuoi appunti rapidi, la lista della spesa mentale o i promemoria importanti salvati nella memoria locale.
            </p>
            
            <!-- Area inserimento nuova nota -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="nuova-nota-input" placeholder="Scrivi un nuovo promemoria..." style="flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 10px; border-radius: 6px; font-size: 0.9rem;">
                <button onclick="aggiungiNota()" style="background: #238636; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem;">Aggiungi</button>
            </div>

            <!-- Elenco Note -->
            <div id="lista-note-container" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- Popolato dinamicamente da JS -->
            </div>
        </div>

    </div>

    <!-- Pulsante Torna al Menu -->
    <div style="max-width: 700px; width: 100%; margin: 20px auto; text-align: center;">
        <a href="menu.html" style="display: inline-flex; justify-content: center; align-items: center; padding: 12px 24px; background: #21262d; border: 1px solid #30363d; border-radius: 10px; color: #c9d1d9; text-decoration: none; font-weight: 600;">
            <span>⬅ Torna al Menu Principale</span>
        </a>
    </div>

    <!-- LOGO FISSO FOOTER RIDOTTO -->
    <div style="text-align: center; margin: 30px 0 20px 0;">
        <img src="IMG/logo_chefstock.png" alt="ChefStock Logo" style="width: 38px; height: 38px; opacity: 0.8; border-radius: 50%;">
    </div>

    <script>
        // Gestione base delle note locali
        document.addEventListener('DOMContentLoaded', () => {
            caricaNote();
        });

        function caricaNote() {
            const container = document.getElementById('lista-note-container');
            let db = JSON.parse(localStorage.getItem('chef_stock_db')) || { note: [] };
            
            if (!db.note || db.note.length === 0) {
                container.innerHTML = `<p style="font-size: 0.85rem; color: #8b949e; text-align: center; margin: 10px 0;">Nessun appunto presente.</p>`;
                return;
            }

            let html = '';
            db.note.forEach((nota, index) => {
                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #21262d; border-radius: 6px; border: 1px solid #30363d;">
                        <span style="font-size: 0.9rem; color: #c9d1d9; ${nota.letto ? '' : 'font-weight: bold; color: #58a6ff;'}">${nota.testo || nota}</span>
                        <button onclick="eliminaNota(${index})" style="background: #da3633; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8rem;">Elimina</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function aggiungiNota() {
            const input = document.getElementById('nuova-nota-input');
            const testo = input.value.trim();
            if (!testo) return;

            let db = JSON.parse(localStorage.getItem('chef_stock_db')) || { note: [] };
            if (!db.note) db.note = [];

            db.note.unshift({ testo: testo, letto: true });
            localStorage.setItem('chef_stock_db', JSON.stringify(db));

            input.value = '';
            caricaNote();
        }

        function eliminaNota(index) {
            let db = JSON.parse(localStorage.getItem('chef_stock_db')) || { note: [] };
            if (db.note) {
                db.note.splice(index, 1);
                localStorage.setItem('chef_stock_db', JSON.stringify(db));
                caricaNote();
            }
        }
    </script>
</body>
</html>
