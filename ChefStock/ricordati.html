<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ric_page_title">ChefStock - Ricordati di...</title>
    <!-- Fogli di stile -->
    <link rel="stylesheet" href="inventario.css">
    <link rel="stylesheet" href="menu.css">
    <script src="i18n.js"></script>
    <style>
        /* Stili specifici per la sezione Promemoria / Ricordati */
        .ricordati-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        .premium-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .input-group-ric {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group-ric input {
            flex: 1;
            padding: 12px 15px;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
        }
        .input-group-ric input:focus {
            border-color: var(--accent-blue);
            outline: none;
        }
        .btn-aggiungi-ric {
            background: var(--accent-blue);
            color: var(--bg-color);
            border: none;
            padding: 0 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-aggiungi-ric:hover {
            opacity: 0.9;
        }
        /* Lista dei promemoria */
        .lista-promemoria {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
        }
        .item-promemoria {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161b22;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .item-promemoria.completato {
            opacity: 0.5;
            background: #0d1117;
        }
        .item-promemoria.completato span.testo-task {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }
        .task-left input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }
        .testo-task {
            color: var(--text-main);
            font-size: 15px;
            word-break: break-word;
        }
        .btn-elimina-task {
            background: transparent;
            border: none;
            color: #f85149;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .btn-elimina-task:hover {
            background: rgba(248, 81, 73, 0.15);
        }
        .empty-tasks {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- MODALE INFORMATIVO (POPUP ❓) -->
    <div id="modal-info-ric" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="info-titolo">ℹ Informazioni - Ricordati di...</h3>
            <p id="info-testo">Caricamento...</p>
            <div class="modal-footer right">
                <button class="btn-primary" onclick="chiudiInfoRic()">Chiudi</button>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 650px;">
        <!-- BARRA SUPERIORE CON LOGO, TITOLO E LINGUA -->
        <div class="top-bar">
            <div class="app-header-right" style="display: flex; align-items: center; gap: 12px;">
                <img src="IMG/logo_chefstock.png" alt="Logo" style="width: 38px; height: 38px;">
                <div class="app-title">ChefStock <span data-i18n="ric_subtitle">- Ricordati di...</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="btn-help-icon" onclick="apriInfoRic()" title="Aiuto e Suggerimenti">?</button>
                <div id="header-lang">
                    <select id="lingua-select" onchange="cambiaLinguaRic(this.value)">
                        <option value="it">🇮🇹 Italiano</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="es">🇪🇸 Español</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- CONTENUTO PRINCIPALE -->
        <div class="ricordati-card">
            <span class="premium-badge" data-i18n="badge_premium">⭐ Funzione Premium</span>
            <h2 style="margin-top: 5px; margin-bottom: 8px; font-size: 1.4rem;" data-i18n="ric_main_title">Promemoria e Note Personali</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px;" data-i18n="ric_main_desc">
                Annota qualsiasi cosa da fare, commissioni fuori sede, acquisti per eventi, farmacia o comunicazioni da non dimenticare.
            </p>

            <!-- INPUT NUOVA ATTIVITA' -->
            <div class="input-group-ric">
                <input type="text" id="nuovo-promemoria-input" data-i18n-placeholder="ric_placeholder" placeholder="Es. Parlare con magazziniere per merce da rendere..." onkeypress="controllaInvio(event)">
                <button class="btn-aggiungi-ric" onclick="aggiungiPromemoria()" data-i18n="ric_btn_add">Aggiungi</button>
            </div>

            <!-- LISTA DINAMICA -->
            <ul id="lista-promemoria-ul" class="lista-promemoria">
                <!-- Generato da JS -->
            </ul>
        </div>

        <!-- PULSANTE TORNA AL MENU -->
        <div style="text-align: center; margin-bottom: 40px;">
            <a href="menu.html" class="menu-btn" style="display: inline-flex; justify-content: center; align-items: center; padding: 12px 24px; background: #21262d; border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); text-decoration: none; font-weight: 600;">
                <span data-i18n="btn_back_menu">⬅ Torna al Menu Principale</span>
            </a>
        </div>
    </div>

    <!-- LOGO FISSO FOOTER -->
    <img src="IMG/logo_chefstock.png" alt="ChefStock Logo" class="footer-logo-fixed">

    <script>
        // Dizionario multilingua specifico per la sezione Ricordati di...
        const dizionarioRic = {
            it: {
                ric_page_title: "ChefStock - Ricordati di...",
                ric_subtitle: "- Ricordati di...",
                badge_premium: "⭐ Funzione Premium",
                ric_main_title: "Promemoria e Note Personali",
                ric_main_desc: "Annota qualsiasi cosa da fare, commissioni fuori sede, acquisti per eventi, farmacia o comunicazioni da non dimenticare.",
                ric_placeholder: "Es. Parlare con magazziniere per merce da rendere...",
                ric_btn_add: "Aggiungi",
                btn_back_menu: "⬅ Torna al Menu Principale",
                empty_list: "Nessun promemoria attivo. Aggiungi una nota qui sopra!",
                info_titolo: "ℹ Guida & Suggerimenti - Ricordati di...",
                info_testo: "Questa sezione è un taccuino intelligente pensato per la vita di tutti i giorni, dentro e fuori dal lavoro.\n\n💡 Esempi di utilizzo:\n• Parlare con il magazziniere per la merce da rendere.\n• Portare un regalino alla cassiera o passare in farmacia.\n• Ricordarsi di prendere i prodotti per la festa dell'associazione di quartiere.\n• Fotografare eventuali volantini o offerte per discuterne in ditta.\n\nCome funziona:\nSpunta la casella a sinistra per barrare l'attività completata, oppure clicca sulla 'X' a destra per eliminarla definitivamente quando non ti serve più."
            },
            en: {
                ric_page_title: "ChefStock - Remember to...",
                ric_subtitle: "- Remember to...",
                badge_premium: "⭐ Premium Feature",
                ric_main_title: "Reminders & Personal Notes",
                ric_main_desc: "Jot down tasks, out-of-office errands, event shopping, pharmacy visits, or anything not to forget.",
                ric_placeholder: "E.g., Talk to warehouse about return goods...",
                ric_btn_add: "Add",
                btn_back_menu: "⬅ Back to Main Menu",
                empty_list: "No active reminders. Add a note above!",
                info_titolo: "ℹ Guide & Tips - Remember to...",
                info_testo: "An intelligent notebook for daily tasks inside and outside work.\n\n💡 Examples:\n• Talk to the warehouse worker about returns.\n• Pick up pharmacy items.\n• Neighborhood association party supplies.\n• Snap photos of leaflets/offers to discuss at work.\n\nHow it works:\nCheck the box to strike through completed tasks, or click the 'X' on the right to delete them."
            },
            fr: {
                ric_page_title: "ChefStock - Rappelez-vous de...",
                ric_subtitle: "- Rappelez-vous de...",
                badge_premium: "⭐ Fonction Premium",
                ric_main_title: "Rappels et Notes Personnelles",
                ric_main_desc: "Notez vos tâches, courses, pharmacie ou autres choses à ne pas oublier.",
                ric_placeholder: "Ex. Parler au magasinier...",
                ric_btn_add: "Ajouter",
                btn_back_menu: "⬅ Retour au Menu",
                empty_list: "Aucun rappel actif.",
                info_titolo: "ℹ Guide - Rappelez-vous de...",
                info_testo: "Un bloc-notes intelligent pour vos commissions et tâches quotidiennes."
            },
            es: {
                ric_page_title: "ChefStock - Acuérdate de...",
                ric_subtitle: "- Acuérdate de...",
                badge_premium: "⭐ Función Premium",
                ric_main_title: "Recordatorios y Notas Personales",
                ric_main_desc: "Anota recados, compras para eventos, farmacia o cualquier cosa que no debas olvidar.",
                ric_placeholder: "Ej. Hablar con el almacenista...",
                ric_btn_add: "Añadir",
                btn_back_menu: "⬅ Volver al Menú",
                empty_list: "No hay recordatorios activos.",
                info_titolo: "ℹ Guía - Acuérdate de...",
                info_testo: "Bloc de notas para tus tareas y recados diarios."
            },
            de: {
                ric_page_title: "ChefStock - Denken Sie daran...",
                ric_subtitle: "- Denken Sie daran...",
                badge_premium: "⭐ Premium-Funktion",
                ric_main_title: "Erinnerungen & Notizen",
                ric_main_desc: "Notieren Sie sich Aufgaben, Erledigungen oder Besorgungen.",
                ric_placeholder: "Z.B. Mit Lageristen sprechen...",
                ric_btn_add: "Hinzufügen",
                btn_back_menu: "⬅ Zurück zum Hauptmenü",
                empty_list: "Keine aktiven Erinnerungen.",
                info_titolo: "ℹ Anleitung - Denken Sie daran...",
                info_testo: "Ein praktischer Notizblock für den Alltag und die Arbeit."
            }
        };

        function cambiaLinguaRic(lang) {
            localStorage.setItem('eat_lang', lang);
            applicaTraduzioniRic(lang);
        }

        function applicaTraduzioniRic(lang) {
            const t = dizionarioRic[lang] || dizionarioRic['it'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    if (el.tagName === 'TITLE') document.title = t[key];
                    else el.textContent = t[key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
            caricaPromemoria();
        }

        // Gestione Dati (LocalStorage)
        function getListaPromemoriaDaStorage() {
            try {
                return JSON.parse(localStorage.getItem('chefstock_promemoria')) || [
                    { id: 1, testo: "Parlare con magazziniere per merce da rendere", completato: false },
                    { id: 2, testo: "Passare in farmacia", completato: false },
                    { id: 3, testo: "Prendere prodotti per festa associazione quartiere", completato: true }
                ];
            } catch (e) {
                return [];
            }
        }

        function salvaPromemoriaInStorage(lista) {
            localStorage.setItem('chefstock_promemoria', JSON.stringify(lista));
        }

        function caricaPromemoria() {
            const lista = getListaPromemoriaDaStorage();
            const ul = document.getElementById('lista-promemoria-ul');
            const lang = localStorage.getItem('eat_lang') || 'it';
            const t = dizionarioRic[lang] || dizionarioRic['it'];

            ul.innerHTML = '';

            if (lista.length === 0) {
                ul.innerHTML = `<li class="empty-tasks">${t.empty_list}</li>`;
                return;
            }

            lista.forEach(item => {
                const li = document.createElement('li');
                li.className = `item-promemoria ${item.completato ? 'completato' : ''}`;
                li.innerHTML = `
                    <div class="task-left">
                        <input type="checkbox" ${item.completato ? 'checked' : ''} onchange="togglePromemoria(${item.id})">
                        <span class="testo-task">${escapeHtml(item.testo)}</span>
                    </div>
                    <button class="btn-elimina-task" onclick="eliminaPromemoria(${item.id})" title="Elimina">✕</button>
                `;
                ul.appendChild(li);
            });
        }

        function aggiungiPromemoria() {
            const input = document.getElementById('nuovo-promemoria-input');
            const testo = input.value.trim();
            if (!testo) return;

            const lista = getListaPromemoriaDaStorage();
            lista.unshift({
                id: Date.now(),
                testo: testo,
                completato: false
            });

            salvaPromemoriaInStorage(lista);
            input.value = '';
            caricaPromemoria();
        }

        function controllaInvio(event) {
            if (event.key === 'Enter') {
                aggiungiPromemoria();
            }
        }

        function togglePromemoria(id) {
            const lista = getListaPromemoriaDaStorage();
            const item = lista.find(i => i.id === id);
            if (item) {
                item.completato = !item.completato;
                salvaPromemoriaInStorage(lista);
                caricaPromemoria();
            }
        }

        function eliminaPromemoria(id) {
            let lista = getListaPromemoriaDaStorage();
            lista = lista.filter(i => i.id !== id);
            salvaPromemoriaInStorage(lista);
            caricaPromemoria();
        }

        function apriInfoRic() {
            const lang = localStorage.getItem('eat_lang') || 'it';
            const t = dizionarioRic[lang] || dizionarioRic['it'];
            document.getElementById('info-titolo').textContent = t.info_titolo;
            document.getElementById('info-testo').innerHTML = (t.info_testo || "").replace(/\n/g, '<br>');
            document.getElementById('modal-info-ric').style.display = 'flex';
        }

        function chiudiInfoRic() {
            document.getElementById('modal-info-ric').style.display = 'none';
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('eat_lang') || 'it';
            const selectEl = document.getElementById('lingua-select');
            if (selectEl) selectEl.value = savedLang;
            applicaTraduzioniRic(savedLang);
        });
    </script>
</body>
</html>
