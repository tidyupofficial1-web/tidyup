<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChefStock - Presentazione</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 40px;
            align-items: center;
        }
        .header-logo {
            text-align: center;
            display: flex;
            justify-content: center;
        }
        .header-logo img {
            max-width: 150px;
            width: 100%;
            height: auto;
            border-radius: 50%; /* Rende l'immagine perfettamente tonda tagliando gli angoli neri */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Aggiunge una leggera ombra elegante */
            border: 2px solid #334155;
        }
        .content-area {
            text-align: left;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-proceed {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background-color 0.2s;
        }
        .btn-proceed:active {
            background-color: #1d4ed8;
        }

        @media (max-width: 768px) {
            .main-card {
                grid-template-columns: 1fr;
                padding: 25px;
                text-align: center;
                gap: 20px;
            }
            .content-area {
                text-align: center;
            }
            .header-logo img {
                max-width: 110px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header-logo">
            <img src="IMG/logo_chefstock.png" alt="ChefStock Logo">
        </div>
        
        <div class="content-area">
            <h1 id="txt-welcome-title">Benvenuto in ChefStock</h1>
            <p id="txt-welcome-desc">Il tuo assistente intelligente per la gestione della dispensa e delle scorte. Organizza al meglio la tua cucina, evita gli sprechi e tieni tutto sotto controllo in modo semplice e veloce.</p>
            <a href="termini.html" class="btn-proceed" id="txt-btn-proceed">Procedi con i Termini e la Configurazione</a>
        </div>
    </div>

</body>
</html>
